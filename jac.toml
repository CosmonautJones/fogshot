[project]
name = "fogshot"
version = "0.1.0"
description = "Jac-first multiplayer physics-siege game"
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.23"

[dependencies]
pymunk = "==7.3.0"

[dependencies.npm]
phaser = "3.90.0"
react = "19.3.0"
react-dom = "19.3.0"
react-router-dom = "6.30.6"
react-error-boundary = "5.0.0"
"@tanstack/react-form" = "1.33.5"
zod = "4.6.5"

[dependencies.npm.dev]
vite = "6.4.3"
"@vitejs/plugin-react" = "4.7.0"
typescript = "5.9.3"
"@types/react" = "19.3.0"
"@types/react-dom" = "19.3.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
port = 8000

[placement]
default = "server"

[placement.pins]
"physics.*" = "server"
"server.*" = "server"
"graph.*" = "server"
"game.rules" = "server"
"game.aim" = "server"
"game.private_world" = "server"
"game.balance" = "server"

[test]
directory = "tests"
verbose = true

[client.app_meta_data]
title = "Fogshot"
description = "Pull back, remember, and bring the hidden outpost down."
